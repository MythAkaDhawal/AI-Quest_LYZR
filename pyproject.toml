[tool.poetry]
name = "sre-triage-agent"
version = "0.1.0"
description = "Autonomous SRE Incident Triage & Governance Engine"
authors = ["SRE Team <sre@example.com>"]
readme = "README.md"
packages = [
    { include = "agents" },
    { include = "backend" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
polars = "^1.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
lyzr-adk = "*"
groq = "*"
tenacity = "^9.0.0"
python-dotenv = "*"
httpx = "^0.27.0"
pytest = "^8.0.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
